name: Build Tawag APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Read app version
        run: echo "VERSION_NAME=$(grep -oP "APP_VERSION = '\K[0-9.]+" www/index.html)" >> "$GITHUB_ENV"

      - name: Install Capacitor and sync the web app
        run: |
          npm install --no-audit --no-fund
          npx cap sync android

      - name: Restore signing key from GitHub Secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ]; then
            echo "::error::Signing secrets are missing. Add ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD (see README), then re-run this workflow."
            exit 1
          fi
          # Keep only the long key text: drops spaces, line breaks and any label pasted along with it.
          CLEAN=$(printf '%s' "$KEYSTORE_BASE64" | tr -d ' \t\r\n' | grep -oE '[A-Za-z0-9+/]{100,}={0,2}' | awk '{ if (length($0) > length(m)) m = $0 } END { print m }')
          echo "Key text: ${#CLEAN} characters (the Tawag key is 3488). Pasted secret was ${#KEYSTORE_BASE64} characters."
          if [ "${#CLEAN}" -lt 3000 ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 holds only ${#CLEAN} characters of key text. It should be 3488. Open ANDROID_KEYSTORE_BASE64.txt, press Ctrl+A then Ctrl+C, and paste it as the secret's value."
            exit 1
          fi
          printf '%s' "$CLEAN" | base64 -d > android/app/release.jks 2>/dev/null || {
            echo "::error::ANDROID_KEYSTORE_BASE64 doesn't decode. Open ANDROID_KEYSTORE_BASE64.txt, press Ctrl+A then Ctrl+C, and paste it as the secret's value."; exit 1; }
          keytool -list -keystore android/app/release.jks -storetype pkcs12 -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null 2>&1 || {
            echo "::error::The key decoded, but ANDROID_KEYSTORE_PASSWORD or ANDROID_KEY_ALIAS doesn't match. Re-enter them exactly as in the secrets file."; exit 1; }
          echo "Signing key OK"

      - name: Build signed APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon

      - name: Rename APK and remove the key file
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk Tawag.apk
          rm -f android/app/release.jks

      - name: Upload APK (Actions tab)
        uses: actions/upload-artifact@v4
        with:
          name: Tawag-APK
          path: Tawag.apk

      - name: Publish to Releases (the in-app QR code points here)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}-build${{ github.run_number }}
          name: Tawag v${{ env.VERSION_NAME }} (build ${{ github.run_number }})
          make_latest: true
          files: Tawag.apk
